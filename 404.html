<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // GitHub Pages 404 redirect для SPA с BrowserRouter
      // Получаем текущий путь
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;

      // Если путь начинается с /AirPressure2Front
      if (path.startsWith('/AirPressure2Front')) {
        // Если это не index.html и не корневой путь, редиректим на index.html с сохранением пути
        if (!path.endsWith('/index.html') && !path.endsWith('/')) {
          // Сохраняем путь после /AirPressure2Front для React Router
          const routePath = path.replace('/AirPressure2Front', '') || '/';
          // Редиректим на index.html, затем используем history API для установки пути
          window.location.replace('/AirPressure2Front/index.html' + search + hash);
          // После загрузки index.html React Router обработает путь через basename
          // Но для этого нужно, чтобы путь был в URL при загрузке
          // Используем sessionStorage для сохранения пути
          sessionStorage.setItem('redirectPath', routePath);
        } else if (path.endsWith('/')) {
          // Если корневой путь, просто редиректим на index.html
          window.location.replace('/AirPressure2Front/index.html' + search + hash);
        }
      } else {
        // Иначе редиректим на главную
        window.location.replace('/AirPressure2Front/index.html' + search + hash);
      }
    </script>
    <meta http-equiv="refresh" content="0; url=/AirPressure2Front/index.html">
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
