<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // GitHub Pages 404 redirect
      // Получаем текущий путь
      const path = window.location.pathname;

      // Если путь начинается с /AirPressure2, редиректим на index.html с этим путем
      if (path.startsWith('/AirPressure2')) {
        window.location.replace('/AirPressure2/index.html' + window.location.search + window.location.hash);
      } else {
        // Иначе редиректим на главную
        window.location.replace('/AirPressure2/');
      }
    </script>
    <meta http-equiv="refresh" content="0; url=/AirPressure2/">
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
