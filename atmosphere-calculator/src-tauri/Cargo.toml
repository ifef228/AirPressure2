[package]
name = "atmospheric-calc"
version = "1.0.0"
description = "Atmospheric Temperature Calculator"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
tauri = { version = "2.9", features = ["custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# this feature is used for production builds or when `devUrl` points to the filesystem
custom-protocol = ["tauri/custom-protocol"]
